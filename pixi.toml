[workspace]
authors = ["vanjaarsveldbarry <a.s.vanjaarsveld@uu.nl>"]
channels = ["conda-forge"]
name = "RAWS"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
pyflwdir = ">=0.5.11,<0.6"
xarray = ">=2026.4.0,<2027"
dask = ">=2026.3.0,<2027"
netcdf4 = ">=1.7.4,<2"
bottleneck = ">=1.6.0,<2"
numpy = ">=2.4.6,<3"
python = ">=3.12,<3.14"
rasterio = ">=1.5.0,<2"
rioxarray = ">=0.22.0,<0.23"
geopandas = ">=1.1.3,<2"
numba = ">=0.62.0"
pydeck = ">=0.9.0"
zarr = ">=3.0,<4"
python-blosc2 = ">=2.0"
zfpy = ">=1.0"
tqdm = ">=1.0" 
h5netcdf = "*"
cdo = "*"
pandas = "*"
python-irodsclient = ">=3.1.1,<4"
ruff = ">=0.16.0,<0.17"
matplotlib-base = ">=3.10,<4"

[pypi-dependencies]
pysz = "*"
pcodec = "*"
xbitinfo = "*"
# conda-forge's imagecodecs build omits SZ3 support; the PyPI wheel bundles it.
imagecodecs = ">=2026.6.26,<2027"
