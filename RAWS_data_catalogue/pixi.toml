# Environment for the catalogue and its test cases.
[workspace]
name = "RAWS_data_catalogue"
authors = ["vanjaarsveldbarry <a.s.vanjaarsveld@uu.nl>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.14,<3.15"
pcraster = ">=4.4.3,<5"
gdal = ">=3.13,<4"
numpy = ">=2.5,<3"
netcdf4 = ">=1.7,<2"
zarr = ">=3.3,<4"
xarray = "*"
pyyaml = "*"
