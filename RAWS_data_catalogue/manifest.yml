          ini_key: precip_downscaling_factor_file

        precip_drydays:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/correctionFactors/dry_days_cutoff
          dst: dry_days_cutoff.zarr
          ini_key: precip_drydays_file

        temp_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/correctionFactors/ta_correction_factor
          dst: ta_correction_factor.zarr
          ini_key: temp_downscaling_factor_file

        evap_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/correctionFactors/pet_correction_factor
          dst: pet_correction_factor.zarr
          ini_key: evap_downscaling_factor_file

      30arcseconds:

        precip_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_30sec_global/forcing/correctionFactors/tp_correction_factor
          dst: tp_correction_factor.zarr
          ini_key: precip_downscaling_factor_file

        precip_drydays:
