        temp_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_30sec_global/forcing/correctionFactors/ta_correction_factor
          dst: ta_correction_factor.zarr
          ini_key: temp_downscaling_factor_file

        evap_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_30sec_global/forcing/correctionFactors/pet_correction_factor
          dst: pet_correction_factor.zarr
          ini_key: evap_downscaling_factor_file

    lapse_rate_approach:

      dem:
        src: /scratch/depfg/sutan101/data/pcrglobwb_input_arise/develop/global_05min_from_gmd_paper_input/meteo/downscaling_from_30min/gtopo05min.nc
        dst: gtopo05min.nc
        ini_key: highResolutionDEM

      cell_ids:
        src: /scratch/depfg/sutan101/data/pcrglobwb_input_arise/develop/global_05min_from_gmd_paper_input/meteo/downscaling_from_30min/uniqueIds_30min.nc
        dst: uniqueIds_30min.nc
        ini_key: meteoDownscaleIds

