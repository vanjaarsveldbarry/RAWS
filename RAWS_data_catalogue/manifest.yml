    temperature:
      src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/W5E5/tas_W5E5v2.0_19790101-20191231.nc
      dst: tas_1979-2019.nc
      ini_key: temperatureNC

    ref_pot_evap:
      src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/W5E5/refPotEvap_W5E5v2.0_1979_2019.nc
      dst: refPotEvap_1979-2019.nc
      ini_key: refETPotFileNC

  downscaling:

    CHELSA_doy_factor:

      5arcminutes:

        precip_downscaling_factor:
          src: /archive/depfg/7006713/_chapter1/data/pcrglob_5min_global/forcing/correctionFactors/tp_correction_factor
