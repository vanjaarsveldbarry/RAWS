        dst: precipitation_slope.nc
        ini_key: precipLapseRateNC

      temperature_correl:
        src: /scratch/depfg/sutan101/data/pcrglobwb_input_arise/develop/global_05min_from_gmd_paper_input/meteo/downscaling_from_30min/temperature_correl.nc
        dst: temperature_correl.nc
        ini_key: temperatCorrelNC

      precipitation_correl:
